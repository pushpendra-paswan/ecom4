<!doctype html>
<!--
  THROWAWAY M6 verification page for the Realtime service.
  Delete frontend/test/ (and the /test/ location in nginx.conf) once the real customer and agent apps exist (M11/M12).
  Open http://localhost:8080/test/realtime.html in several tabs; each tab keeps its own token in sessionStorage.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realtime test page</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 960px; }
    fieldset { margin-bottom: 12px; }
    input { margin-right: 8px; }
    button { margin-right: 6px; }
    #status { font-weight: bold; margin: 8px 0; }
    #log { font-family: monospace; font-size: 13px; border: 1px solid #ccc; padding: 8px; min-height: 120px; }
    .entry { border-bottom: 1px solid #eee; padding: 4px 0; white-space: pre-wrap; }
    .duplicate { color: #c00; font-weight: bold; }
    .messages { color: #555; margin-left: 16px; }
  </style>
</head>
<body>
  <h1>Realtime test page (M6, throwaway)</h1>

  <fieldset>
    <legend>1. Log in</legend>
    <input id="email" type="email" value="customer1@example.com" size="28">
    <input id="password" type="password" value="Password123!">
    <button id="login-button">Log in</button>
    <span id="login-result">Not logged in</span>
  </fieldset>

  <fieldset>
    <legend>2. WebSocket</legend>
    <button id="connect-button">Connect</button>
    <button id="bad-token-button">Connect with a bad token</button>
    <button id="ping-button">Send ping</button>
    <button id="disconnect-button">Disconnect</button>
    <button id="clear-button">Clear log</button>
    <div id="status">Not connected</div>
  </fieldset>

  <h2>Event log (newest first)</h2>
  <div id="log">No events yet</div>

  <script type="module">
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginResult = document.getElementById("login-result");
    const statusLine = document.getElementById("status");
    const log = document.getElementById("log");

    // The socket of this tab, and every event_id seen so far (to flag duplicates)
    let socket = null;
    const seenEventIds = new Set();

    // Adds one line to the top of the log and returns it, so more text can be attached below it
    function addLogEntry(text, className) {
      if (log.textContent === "No events yet") {
        log.textContent = "";
      }
      const entry = document.createElement("div");
      entry.className = "entry " + (className || "");
      entry.textContent = new Date().toLocaleTimeString() + "  " + text;
      log.prepend(entry);
      return entry;
    }

    // Opens the WebSocket and sends the auth message with the given token as soon as it opens
    function connect(token) {
      // Step 1: close any previous socket of this tab
      if (socket !== null) {
        socket.close();
      }

      // Step 2: open the socket (same host as the page, so it goes through Nginx)
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws/connect`);
      const thisSocket = socket;
      statusLine.textContent = "Connecting...";

      // Step 3: authenticate with the first message (tokens never go in the URL)
      thisSocket.addEventListener("open", () => {
        thisSocket.send(JSON.stringify({ type: "auth", token: token }));
        statusLine.textContent = "Connected, waiting for auth_ok...";
      });

      // Step 4: handle every message from the server
      thisSocket.addEventListener("message", async (messageEvent) => {
        const message = JSON.parse(messageEvent.data);

        // Step 4a: auth_ok shows who we are and which instance holds this connection
        if (message.type === "auth_ok") {
          statusLine.textContent = `auth_ok: user ${message.user_id} (${message.role}) on instance ${message.instance}`;
          addLogEntry(`auth_ok on instance ${message.instance}`);
          return;
        }
        if (message.type === "pong") {
          addLogEntry("pong");
          return;
        }
        if (message.type === "error") {
          addLogEntry(`error from server: ${message.message}`, "duplicate");
          return;
        }

        // Step 4b: an event. Flag a repeated event_id as a DUPLICATE
        const envelope = message.event;
        const isDuplicate = seenEventIds.has(envelope.event_id);
        seenEventIds.add(envelope.event_id);
        const prefix = isDuplicate ? "DUPLICATE " : "";
        const entry = addLogEntry(
          `${prefix}${envelope.event_type}  event_id=${envelope.event_id}\n  data=${JSON.stringify(envelope.data)}`,
          isDuplicate ? "duplicate" : ""
        );

        // Step 4c: events carry only ids; for a new message, fetch the ticket over REST (which checks permissions)
        if (envelope.event_type === "ticket.message_created" && !isDuplicate) {
          const details = document.createElement("div");
          details.className = "messages";
          details.textContent = "Loading ticket...";
          entry.appendChild(details);
          try {
            const response = await fetch(`/api/tickets/tickets/${envelope.data.ticket_id}`, {
              headers: { Authorization: `Bearer ${sessionStorage.getItem("token")}` },
            });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const ticketDetail = await response.json();
            const lines = ticketDetail.messages.map((ticketMessage) => {
              const marker = ticketMessage.id === envelope.data.message_id ? "  <- new" : "";
              return `[${ticketMessage.sender_type}] ${ticketMessage.content}${marker}`;
            });
            details.textContent = `Ticket "${ticketDetail.ticket.subject}" (${ticketDetail.ticket.status}):\n` + lines.join("\n");
          } catch (error) {
            details.textContent = `Could not load the ticket: ${error.message}`;
          }
        }
      });

      // Step 5: show the close code (4401 = unauthorized)
      thisSocket.addEventListener("close", (closeEvent) => {
        statusLine.textContent = `Closed with code ${closeEvent.code} ${closeEvent.reason}`;
        addLogEntry(`socket closed: code ${closeEvent.code} ${closeEvent.reason}`);
      });
    }

    // Log in through the Identity REST API and keep the token in sessionStorage (one per tab)
    document.getElementById("login-button").addEventListener("click", async () => {
      loginResult.textContent = "Logging in...";
      try {
        // Step 1: post the credentials
        const response = await fetch("/api/identity/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: emailInput.value, password: passwordInput.value }),
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        // Step 2: store the token
        const data = await response.json();
        sessionStorage.setItem("token", data.access_token);
        loginResult.textContent = `Logged in as ${emailInput.value}`;
      } catch (error) {
        loginResult.textContent = `Login failed: ${error.message}`;
      }
    });

    document.getElementById("connect-button").addEventListener("click", () => {
      const token = sessionStorage.getItem("token");
      if (token === null) {
        statusLine.textContent = "Log in first";
        return;
      }
      connect(token);
    });

    document.getElementById("bad-token-button").addEventListener("click", () => {
      connect("this-is-not-a-valid-token");
    });

    document.getElementById("ping-button").addEventListener("click", () => {
      if (socket === null || socket.readyState !== WebSocket.OPEN) {
        statusLine.textContent = "Not connected";
        return;
      }
      socket.send(JSON.stringify({ type: "ping" }));
    });

    document.getElementById("disconnect-button").addEventListener("click", () => {
      if (socket !== null) {
        socket.close();
      }
    });

    document.getElementById("clear-button").addEventListener("click", () => {
      log.textContent = "No events yet";
    });

    // On reload, show who this tab is logged in as (the token survives a reload in sessionStorage)
    if (sessionStorage.getItem("token") !== null) {
      loginResult.textContent = "Logged in (token from this tab's sessionStorage)";
    }
  </script>
</body>
</html>
