<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-header" class="app-header" hidden>
    <div class="header-inner">
      <span class="brand">Support Dashboard</span>
      <nav aria-label="Main">
        <a href="#/tickets" data-nav="tickets">Tickets</a>
        <a href="#/approvals" data-nav="approvals">
          Approvals
          <span id="pending-count" class="count" title="Pending approvals" hidden></span>
        </a>
      </nav>
      <span id="connection-status" class="connection-status" role="status" hidden>Reconnecting…</span>
      <span class="user">
        <span id="user-email"></span>
        <span id="user-role" class="badge"></span>
        <button id="sign-out-button" type="button">Sign out</button>
      </span>
    </div>
  </header>
  <main id="app" class="app-main">Loading…</main>
  <noscript>This dashboard needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
