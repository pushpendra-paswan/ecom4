name: ai-support-platform

services:
  # ---------- Infrastructure ----------

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      # -h 127.0.0.1 uses TCP, which only opens after the init script has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------- Services ----------

  identity:
    build: ./services/identity
    environment:
      SERVICE_NAME: identity
      PORT: 8001
      ROOT_PATH: /api/identity
      DATABASE_URL: ${IDENTITY_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # mount the key DIRECTORIES (a missing single file would become a directory); only identity gets the private one
    volumes:
      - ./keys/private:/keys/private:ro
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticket:
    build: ./services/ticket
    environment:
      SERVICE_NAME: ticket
      PORT: 8002
      ROOT_PATH: /api/tickets
      DATABASE_URL: ${TICKET_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      REFUND_AUTO_APPROVE_LIMIT: ${REFUND_AUTO_APPROVE_LIMIT}
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # only the public key folder: the ticket service must never see the private key
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order:
    build: ./services/order
    environment:
      SERVICE_NAME: order
      PORT: 8003
      ROOT_PATH: /api/orders
      DATABASE_URL: ${ORDER_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # only the public key folder: the order service must never see the private key
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  knowledge:
    build: ./services/knowledge
    environment:
      SERVICE_NAME: knowledge
      PORT: 8004
      ROOT_PATH: /api/knowledge
      DATABASE_URL: ${KNOWLEDGE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  agent:
    build: ./services/agent
    environment:
      SERVICE_NAME: agent
      PORT: 8005
      ROOT_PATH: /api/agent
      DATABASE_URL: ${AGENT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  realtime:
    build: ./services/realtime
    environment:
      SERVICE_NAME: realtime
      PORT: 8006
      ROOT_PATH: /ws
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------- Reverse proxy and static files ----------

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - identity
      - ticket
      - order
      - knowledge
      - agent
      - realtime

volumes:
  postgres_data:
  rabbitmq_data:
