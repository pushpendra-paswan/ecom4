name: ai-support-platform

services:
  # ---------- Infrastructure ----------

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/init_databases.sql:ro
    healthcheck:
      # -h 127.0.0.1 uses TCP, which only opens after the init script has finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------- Services ----------

  identity:
    build: ./services/identity
    environment:
      SERVICE_NAME: identity
      PORT: 8001
      ROOT_PATH: /api/identity
      DATABASE_URL: ${IDENTITY_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # mount the key DIRECTORIES (a missing single file would become a directory); only identity gets the private one
    volumes:
      - ./keys/private:/keys/private:ro
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticket:
    build: ./services/ticket
    environment:
      SERVICE_NAME: ticket
      PORT: 8002
      ROOT_PATH: /api/tickets
      DATABASE_URL: ${TICKET_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      REFUND_AUTO_APPROVE_LIMIT: ${REFUND_AUTO_APPROVE_LIMIT}
      GRPC_PORT: 50053
      # gRPC service tokens: shared HS256 secret (Compose stops if it is missing) and the callers allowed in
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
      # M9: the order service calls GetApproval to verify approvals before refunding
      GRPC_ALLOWED_CALLERS: agent,order
    # gRPC for service-to-service calls; published on localhost ONLY so the host-side client script
    # (scripts/grpc_client_check.py) can reach it. Development-only: other containers use ticket:50053.
    ports:
      - "127.0.0.1:50053:50053"
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # only the public key folder: the ticket service must never see the private key
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order:
    build: ./services/order
    environment:
      SERVICE_NAME: order
      PORT: 8003
      ROOT_PATH: /api/orders
      DATABASE_URL: ${ORDER_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      GRPC_PORT: 50051
      # gRPC service tokens: shared HS256 secret (Compose stops if it is missing) and the callers allowed in
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
      GRPC_ALLOWED_CALLERS: agent
      # M9: the Ticket gRPC server (the API itself does not call it; same config.py as the worker)
      TICKET_GRPC_ADDRESS: ticket:50053
    # gRPC for service-to-service calls; published on localhost ONLY so the host-side client script
    # (scripts/grpc_client_check.py) can reach it. Development-only: other containers use order:50051.
    ports:
      - "127.0.0.1:50051:50051"
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # only the public key folder: the order service must never see the private key
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Celery worker for the order service (M9): same image, different command. It verifies approved refund approvals
  # with the Ticket service over gRPC (token sub=order) and executes the simulated refund.
  order-worker:
    build: ./services/order
    environment:
      SERVICE_NAME: order-worker
      DATABASE_URL: ${ORDER_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      # required by the shared config.py; the worker never checks user tokens, so the key folder is not mounted
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      # also only required by config.py: the worker never starts the gRPC server
      GRPC_PORT: 50051
      GRPC_ALLOWED_CALLERS: none
      # the worker IS a gRPC caller (of Ticket), so it gets the real shared secret
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
      TICKET_GRPC_ADDRESS: ticket:50053
    # its own Celery queue on the shared RabbitMQ
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "order", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Event consumer for the order service (M9): same image; turns approval.decided (approved refunds) into Celery tasks
  order-consumer:
    build: ./services/order
    environment:
      SERVICE_NAME: order-consumer
      RABBITMQ_URL: ${RABBITMQ_URL}
      # only required by the shared config.py: the consumer never uses a database, tokens or gRPC
      DATABASE_URL: not-used-by-the-consumer
      REDIS_URL: not-used-by-the-consumer
      JWT_PUBLIC_KEY_PATH: not-used-by-the-consumer
      GRPC_PORT: 50051
      GRPC_ALLOWED_CALLERS: none
      SERVICE_TOKEN_SECRET: not-used-by-the-consumer
      TICKET_GRPC_ADDRESS: ticket:50053
    command: ["python", "-m", "app.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  knowledge:
    build: ./services/knowledge
    environment:
      SERVICE_NAME: knowledge
      PORT: 8004
      ROOT_PATH: /api/knowledge
      DATABASE_URL: ${KNOWLEDGE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      GRPC_PORT: 50052
      # gRPC service tokens: shared HS256 secret (Compose stops if it is missing) and the callers allowed in
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
      GRPC_ALLOWED_CALLERS: agent
    # gRPC for service-to-service calls; published on localhost ONLY so the host-side client script
    # (scripts/grpc_client_check.py) can reach it. Development-only: other containers use knowledge:50052.
    ports:
      - "127.0.0.1:50052:50052"
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # only the public key folder: the knowledge service must never see the private key
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Celery worker for the knowledge service: same image, different command. It ingests documents.
  knowledge-worker:
    build: ./services/knowledge
    environment:
      SERVICE_NAME: knowledge-worker
      DATABASE_URL: ${KNOWLEDGE_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      # required by the shared config.py; the worker never checks tokens, so the key folder is not mounted
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      # also only required by config.py: the worker never starts the gRPC server, so it gets no real secret
      GRPC_PORT: 50052
      SERVICE_TOKEN_SECRET: not-used-by-the-worker
      GRPC_ALLOWED_CALLERS: none
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    # its own Celery queue (the agent worker uses the same RabbitMQ with queue "agent")
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "knowledge", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Agent API: only GET /runs and /health (staff visibility). The AI itself runs in agent-worker.
  agent:
    build: ./services/agent
    environment:
      SERVICE_NAME: agent
      PORT: 8005
      ROOT_PATH: /api/agent
      DATABASE_URL: ${AGENT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
      KNOWLEDGE_GRPC_ADDRESS: knowledge:50052
      TICKET_GRPC_ADDRESS: ticket:50053
      ORDER_GRPC_ADDRESS: order:50051
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT}
      AGENT_HISTORY_LIMIT: ${AGENT_HISTORY_LIMIT}
    # run the migration first, then start the API ($$ stops Compose from replacing PORT itself)
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT}"]
    # only the public key folder: the agent service verifies staff tokens, it never signs them
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Celery worker for the agent: same image, runs the LangGraph agent (tasks run_agent_for_message and, from M9,
  # resume_after_approval; queue "agent")
  agent-worker:
    build: ./services/agent
    environment:
      SERVICE_NAME: agent-worker
      DATABASE_URL: ${AGENT_DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      # required by the shared config.py; the worker never checks user tokens, so the key folder is not mounted
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CHAT_MODEL: ${CHAT_MODEL}
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET:?set SERVICE_TOKEN_SECRET in .env}
      KNOWLEDGE_GRPC_ADDRESS: knowledge:50052
      TICKET_GRPC_ADDRESS: ticket:50053
      ORDER_GRPC_ADDRESS: order:50051
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT}
      AGENT_HISTORY_LIMIT: ${AGENT_HISTORY_LIMIT}
    command: ["celery", "-A", "app.celery_app", "worker", "-Q", "agent", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Event consumer for the agent: same image; turns ticket.message_created (customer messages) and, from M9,
  # approval.decided (human decisions) into Celery tasks
  agent-consumer:
    build: ./services/agent
    environment:
      SERVICE_NAME: agent-consumer
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
      # only required by the shared config.py: the consumer never uses a database, a model, tokens or gRPC
      DATABASE_URL: not-used-by-the-consumer
      JWT_PUBLIC_KEY_PATH: not-used-by-the-consumer
      OPENAI_API_KEY: not-used-by-the-consumer
      CHAT_MODEL: not-used-by-the-consumer
      SERVICE_TOKEN_SECRET: not-used-by-the-consumer
    command: ["python", "-m", "app.consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Scalable: no container_name and no published port, so `docker compose up --build --scale realtime=2` works.
  # Nginx reaches every replica through the service name (resolved when Nginx starts).
  realtime:
    build: ./services/realtime
    environment:
      SERVICE_NAME: realtime
      PORT: 8006
      ROOT_PATH: /ws
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    # only the public key folder: realtime verifies tokens, it never signs them
    volumes:
      - ./keys/public:/keys/public:ro
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ---------- Reverse proxy and static files ----------

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - identity
      - ticket
      - order
      - knowledge
      - agent
      - realtime

volumes:
  postgres_data:
  rabbitmq_data:
