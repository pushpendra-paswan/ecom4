events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WebSocket: send "Connection: upgrade" only when the client asks for an upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;

        # Headers every proxied request carries
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Static frontends (frontend/ is mounted at /usr/share/nginx/html)
        root /usr/share/nginx/html;

        location /customer/ {
            index index.html;
        }

        location /agent/ {
            index index.html;
        }

        # REST APIs: the trailing slash in proxy_pass strips the prefix,
        # so /api/identity/health reaches the identity service as /health
        location /api/identity/ {
            proxy_pass http://identity:8001/;
        }

        location /api/tickets/ {
            proxy_pass http://ticket:8002/;
        }

        location /api/orders/ {
            proxy_pass http://order:8003/;
        }

        location /api/knowledge/ {
            proxy_pass http://knowledge:8004/;
        }

        location /api/agent/ {
            proxy_pass http://agent:8005/;
        }

        # Throwaway M6 verification page (frontend/test/realtime.html); delete with the folder once the real frontends exist
        location /test/ {
            index index.html;
        }

        # WebSockets: /ws/<path> reaches the realtime service as /<path> (the browser connects to /ws/connect).
        # "realtime" resolves to every replica when Nginx starts, and Nginx spreads new connections across them
        # (round robin). After scaling realtime while Nginx is already running, restart Nginx.
        location /ws/ {
            proxy_pass http://realtime:8006/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # keep idle WebSockets open for a long time (Uvicorn's own protocol pings also keep them alive)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
